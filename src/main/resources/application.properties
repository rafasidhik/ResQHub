# =====================================================================
# ResQHub - Spring Boot 3.2.4 Application Configuration
# =====================================================================
server.port=8080
server.servlet.context-path=/
server.servlet.session.cookie.name=RESQHUBSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Spring MVC & Static Resources ----------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ---------- Thymeleaf HTML Template Engine ----------
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ---------- MySQL 8.x Database (Zero-ORM JdbcTemplate) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/resqhub_web?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=resqhub_app
spring.datasource.password=ResQHub@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- HikariCP Connection Pool ----------
spring.datasource.hikari.pool-name=ResQHubHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ---------- Logging ----------
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.resqhub=DEBUG
