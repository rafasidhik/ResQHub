# Application Name & Banner
spring.application.name=ResQHub
spring.main.banner-mode=console

# Server Configuration
server.port=${PORT:${SERVER_PORT:8085}}
server.servlet.context-path=/
server.error.whitelabel.enabled=false

# MySQL Database DataSource via Spring JDBC (JdbcTemplate)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-359185f-resqhub.j.aivencloud.com:11750/resqhub?sslMode=REQUIRED&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Configuration
logging.level.root=INFO
logging.level.com.resqhub=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG

# SQL Data Initialization (Disabled by default in production; enable locally via SQL_INIT_MODE=always)
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.data-locations=file:database/sample-data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true
