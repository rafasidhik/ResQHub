<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Access Denied &mdash; ResQHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center my-5">
        <div class="col-md-6 text-center">
            <div class="card card-resq shadow-sm p-5 border-0">
                <div class="mb-3">
                    <i class="bi bi-shield-lock-fill text-danger" style="font-size: 4rem;"></i>
                </div>
                <h2 class="fw-bold text-danger mb-2">403 &mdash; Access Denied</h2>
                <p class="text-muted mb-4">
                    You do not have the required role permissions to view or perform operations on this page.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/dashboard}" class="btn btn-resq-primary">
                        <i class="bi bi-house-door me-1"></i> Return to Dashboard
                    </a>
                    <a th:href="@{/}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Public Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
