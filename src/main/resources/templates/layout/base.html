<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en"
      th:fragment="layout (title, content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">ResQHub — Integrated Disaster Response Coordination</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- ResQHub Design System -->
    <link rel="stylesheet" th:href="@{/css/resqhub.css}">
</head>

<body>

    <!-- Top Navigation Bar (anonymous visitors only) -->
    <th:block sec:authorize="isAnonymous()">
        <div th:replace="~{layout/navbar :: navbar}"></div>
    </th:block>

    <!-- Main Content & Sidebar Wrapper -->
    <div class="main-wrapper">
        <!-- Sidebar for Authenticated Users -->
        <th:block sec:authorize="isAuthenticated()">
            <div th:replace="~{layout/sidebar :: sidebar}"></div>
        </th:block>
        <div sec:authorize="isAuthenticated()" class="sidebar-backdrop"></div>
        <button sec:authorize="isAuthenticated()" id="sidebarOpen" type="button" class="sidebar-open-btn d-lg-none" aria-label="Open menu">
            <i class="bi bi-list fs-4"></i>
        </button>

        <!-- Main Workspace -->
        <main class="main-content">
            <div class="container-fluid">
                <!-- Flash Feedback Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm"
                    role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${successMessage}">Operation successful!</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm"
                    role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${errorMessage}">An error occurred.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show shadow-sm"
                    role="alert">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    <span th:text="${warningMessage}">Warning alert.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <span th:text="${infoMessage}">Informational message.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Page Injected Content -->
                <div th:replace="${content}">
                    <div th:fragment="content">
                        <p>Default main page content</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Footer -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js for Dashboards & Reports -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <!-- ResQHub Core Client Script -->
    <script th:src="@{/js/resqhub.js}"></script>
</body>

</html>
