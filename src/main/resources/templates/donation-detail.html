<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${'Donation #' + d.id}, 'DONATIONS', ~{::#content})}">
<body>
<div id="content">
  <div class="rq-page-head">
    <div>
      <h1 th:text="${'Donation #' + d.id}">Donation #0</h1>
      <div class="sub" th:text="${'From ' + (donor != null ? donor.fullName : 'unknown donor')}">From donor</div>
    </div>
    <div class="d-flex gap-2 flex-wrap no-print">
      <a class="btn btn-outline-secondary" th:href="@{/app/donations}">
        <i class="bi bi-arrow-left me-1"></i>All donations
      </a>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#distDonation">
        <i class="bi bi-truck me-1"></i>Record distribution
      </button>
    </div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <dl class="kv row mb-0">
            <dt class="col-4">Type</dt>
            <dd class="col-8" th:text="${d.donationType.label}">Cash</dd>
            <dt class="col-4" th:text="${d.donationType.name() == 'CASH' ? 'Amount' : 'Material'}">Amount</dt>
            <dd class="col-8">
              <span th:if="${d.donationType.name() == 'CASH'}" th:text="${'₹ ' + d.amount}">₹ 0</span>
              <span th:unless="${d.donationType.name() == 'CASH'}" th:text="${d.materialName + ' × ' + d.quantity}">Material × 0</span>
            </dd>
            <dt class="col-4">Donated</dt>
            <dd class="col-8" th:text="${d.donatedAt}">Date</dd>
            <dt class="col-4">Notes</dt>
            <dd class="col-8 mb-0" th:text="${d.description != null and !d.description.isEmpty() ? d.description : '—'}">—</dd>
          </dl>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between mb-2">
            <strong>Status</strong>
            <span class="rq-badge"
                  th:classappend="${'rq-' + #strings.toLowerCase(#strings.replace(d.status.label, ' ', '-'))}"
                  th:text="${d.status.label}">Status</span>
          </div>
          <form method="post" th:action="@{/app/donations}" class="d-flex gap-2">
            <input type="hidden" name="action" value="status">
            <input type="hidden" name="id" th:value="${d.id}">
            <select class="form-select" name="status" aria-label="Status">
              <option th:each="o : ${donationStatuses}"
                      th:value="${o[0]}"
                      th:text="${o[1]}"
                      th:selected="${o[0] == d.status.name()}">Status</option>
            </select>
            <button class="btn btn-primary" type="submit">Update</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Distribution / allocation records</div>
    <div class="table-responsive">
      <table class="table rq-table align-middle" id="tblDonDist">
        <thead>
          <tr>
            <th th:each="h : ${distHeaders}" scope="col" th:text="${h}">Header</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${distRows}" data-row>
            <td th:each="cell : ${row}" th:text="${cell != null ? cell.toString() : ''}">Cell</td>
          </tr>
          <tr th:if="${#lists.isEmpty(distRows)}" data-empty>
            <td th:colspan="${#lists.size(distHeaders)}">
              <div class="rq-empty">
                <i class="bi bi-truck"></i>
                <div class="empty-title">Not distributed yet.</div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Record Distribution Modal -->
  <div class="modal fade" id="distDonation" tabindex="-1" aria-labelledby="distDonationTitle" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form method="post" th:action="@{/app/donations}">
          <input type="hidden" name="action" value="distribute">
          <input type="hidden" name="id" th:value="${d.id}">
          <div class="modal-header">
            <h5 class="modal-title" id="distDonationTitle">Record a distribution</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body row g-3">
            <div class="col-12">
              <label class="form-label">Distributed to <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="distributedTo" required>
            </div>
            <div class="col-12">
              <label class="form-label" th:text="${d.donationType.name() == 'CASH' ? 'Amount (₹)' : 'Quantity'}">Quantity</label>
              <input type="number" class="form-control" name="quantity" min="0.01" step="0.01" required>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" name="description" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
