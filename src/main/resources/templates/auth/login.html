<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Login &mdash; ResQHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center my-4">
        <div class="col-md-6 col-lg-5">
            <div class="card card-resq shadow-sm p-4 border-0">
                <div class="text-center mb-4">
                    <img th:src="@{/images/logo.svg}" alt="ResQHub Logo" height="48" class="mb-2">
                    <h3 class="fw-bold" style="color: var(--resq-green-dark);">Account Login</h3>
                    <p class="text-muted small">Sign in to coordinate disaster relief and rescue operations</p>
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" id="username" name="username" class="form-control border-start-0" 
                                   placeholder="Enter your username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" id="password" name="password" class="form-control border-start-0" 
                                   placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-resq-primary btn-lg fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Don't have an account? 
                        <a th:href="@{/register}" class="fw-bold text-decoration-none" style="color: var(--resq-green-primary);">Register here</a>
                    </p>
                </div>
            </div>

             <!-- Demo Logins Reference Accordion removed as requested -->

        </div>
    </div>
</div>
</body>
</html>
