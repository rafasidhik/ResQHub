<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · ResQHub</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/assets/images/logo.svg(v='4.0')}">
  <link rel="stylesheet" th:href="@{/assets/vendor/bootstrap/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/assets/vendor/icons/bootstrap-icons.min.css}">
  <link rel="stylesheet" th:href="@{/assets/css/resqhub.css(v='4.0')}">
</head>
<body>
<div class="rq-auth">
  <section class="rq-auth-hero" aria-label="About ResQHub">
    <div><img th:src="@{/assets/images/logo.svg(v='4.0')}" alt="ResQHub logo"></div>
    <h1>ResQHub</h1>
    <div class="slogan">Help. Hope. Humanity.</div>
    <p class="mt-3">Integrated Disaster Response Coordination System — bringing rescue teams, volunteers,
       shelters, supplies and donations together in one place.</p>
  </section>
  <main class="rq-auth-form">
    <div class="rq-auth-card">
      <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}">Error</span>
      </div>

      <h2 class="h3 mb-1">Reset password</h2>
      <p class="text-brown mb-4">Enter your username and the e-mail address registered with your account.</p>

      <form method="post" th:action="@{/forgot-password}" class="row g-3">
        <div class="col-12">
          <label class="form-label" for="username">Username <span class="req">*</span></label>
          <input class="form-control" id="username" name="username" required autocomplete="username" th:value="${username}">
        </div>
        <div class="col-12">
          <label class="form-label" for="email">Registered email <span class="req">*</span></label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email" th:value="${email}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="newPassword">New password <span class="req">*</span></label>
          <input class="form-control" type="password" id="newPassword" name="newPassword" required autocomplete="new-password">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="confirmPassword">Confirm new password <span class="req">*</span></label>
          <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
        </div>
        <div class="col-12 d-grid mt-4">
          <button class="btn btn-primary btn-lg" type="submit">Reset password</button>
        </div>
      </form>
      <p class="mt-3 small"><a th:href="@{/login}">&larr; Back to log in</a></p>
    </div>
  </main>
</div>
<script th:src="@{/assets/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/rq.js}"></script>
</body>
</html>
