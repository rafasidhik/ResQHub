<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Register &mdash; ResQHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center my-4">
        <div class="col-md-8 col-lg-6">
            <div class="card card-resq shadow-sm p-4 border-0">
                <div class="text-center mb-4">
                    <img th:src="@{/images/logo.svg}" alt="ResQHub Logo" height="44" class="mb-2">
                    <h3 class="fw-bold" style="color: var(--resq-green-dark);">Create Your Account</h3>
                    <p class="text-muted small">Register as a Citizen or Volunteer to access disaster coordination services</p>
                </div>

                <!-- Registration Form -->
                <form th:action="@{/register}" th:object="${userDto}" method="post">
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                            <input type="text" id="username" th:field="*{username}" class="form-control"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                   placeholder="e.g. rahul_sen" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="fullName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="e.g. Rahul Sen" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="name@example.com" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                   placeholder="+91 98765 43210">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">I want to register as <span class="text-danger">*</span></label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{requestedRole}" id="roleCitizen" value="CITIZEN" checked>
                                <label class="form-check-label" for="roleCitizen">
                                    <strong>Citizen</strong>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{requestedRole}" id="roleVolunteer" value="VOLUNTEER">
                                <label class="form-check-label" for="roleVolunteer">
                                    <strong>Volunteer</strong>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                   placeholder="Minimum 6 characters" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   placeholder="Re-type password" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-resq-primary btn-lg fw-semibold">
                            <i class="bi bi-person-check me-2"></i> Register Account
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Already registered? 
                        <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--resq-green-primary);">Log In here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
